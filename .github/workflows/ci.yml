name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 단일 정적 바이너리가 배포 전략이므로, 무엇도 조용히 C에 의존하기 시작하면 안 된다.
  # 레이스 검출 잡에서만 의도적으로 이 값을 뒤집는다.
  CGO_ENABLED: "0"

jobs:
  readonly:
    name: 조회 전용 가드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 가드의 자체 검사를 먼저 돌린다. 실패할 능력을 조용히 잃어버린 가드는 없는 가드보다
      # 위험하다. 신뢰받기 때문이다.
      - name: 스캐너 자체 검사
        run: ./scripts/verify-readonly.sh --self-test

      - name: 조회 API만 호출하는지 검사
        run: ./scripts/verify-readonly.sh

  static:
    name: 정적 분석
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: go mod tidy 상태 확인
        run: make tidy-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.6.2

  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 비공개 저장소에서는 실행 분이 청구되고 배수가 붙는다. Windows는 2배,
        # macOS는 10배다. 그래서 CI에서 돌리는 기준을 "로컬에서 못 돌리는 것"으로 잡았다.
        #
        # Windows는 항상 돈다. 개발 기계가 macOS라 손으로 확인할 방법이 없고, 경로 처리와
        # 터미널 렌더링 차이가 실제로 나는 지원 대상이다.
        #
        # macOS는 태그 푸시와 수동 실행에서만 돈다. 개발 기계가 macOS이므로 일상 검증은
        # 로컬에서 이미 이루어지고, 릴리스 직전에 CI가 한 번 더 확인한다.
        #
        # 저장소를 공개로 바꾸면 표준 러너는 무료이므로 이 조건을 지우고 세 OS를 항상 돌려라.
        os: >-
          ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
          && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]')
          || fromJSON('["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Windows는 곁다리가 아니라 지원 대상이다. 경로 처리와 터미널 렌더링이 실제로
      # 다르므로 테스트가 거기서도 통과해야 한다.
      - name: 테스트
        run: go test -count=1 ./...

      - name: 빌드
        run: go build -trimpath ./...

      - name: 바이너리 스모크 테스트
        shell: bash
        run: |
          go build -trimpath -o cloudloupe ./cmd/cloudloupe
          ./cloudloupe --version

  race:
    name: 레이스 검출
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 수집기는 리전과 리소스 타입으로 팬아웃하므로, 데이터 레이스가 사용자에게 원인 불명의
      # 이상 동작으로 도달할 가능성이 가장 높은 실패 유형이다.
      - name: -race로 테스트
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./...

  cross:
    name: 크로스 컴파일
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 플랫폼별 컴파일 실패를 릴리스 도중이 아니라 여기서 잡는다. 릴리스에서는 태그 하나로
      # 아카이브 6개를 만들어야 한다.
      - name: 모든 릴리스 대상 빌드
        run: make cross

  coverage:
    name: 커버리지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 커버리지 포함 테스트
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: 결과 보고
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
